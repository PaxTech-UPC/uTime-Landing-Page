<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

    }

    }

    .text-primary {
        color: purple;
    }
</style>
<body>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavDropdown">
            <ul class="navbar-nav ">
                <li class="nav-item">
                    <a class="nav-link" href="index.html" data-i18n="navbar.home">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="pricing.html" data-i18n="navbar.pricing">Pricing</a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown" data-i18n="navbar.more">More</a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="about-us.html" data-i18n="navbar.about">About Us</a></li>
                        <li><a class="dropdown-item" href="contact-us.html" data-i18n="navbar.contact">Contact us</a></li>
                    </ul>

            <ul class="navbar-nav mx-auto">

            </ul>
            <div class="d-flex flex-column flex-lg-row gap-2">

                <button type="button" class="btn btn-warning ms-lg-3" onclick="window.location.href='register.html'" id="register-btn">Register</button>
            </div>
        </div>
        <button class="btn btn-outline-secondary ms-2" data-toggle-lang>EN</button>
    </div>
</nav>

<div class="container-fluid mt-5 pt-5">
    <div class="row">
        <!-- Left section -->
        <div class="col-md-6 px-4">
            <h6 class="fw-bold text-wrap py-5" style="font-size: clamp(2rem, 6vw, 10rem); line-height: 1.2;" data-i18n="contact.title">
                CONTACT US
            </h6>

            <h4 class="text-start py-2 px-2">uTime</h4>

            <div class="d-flex gap-4 ps-2 pb-3">
                <a href="#" class="social-icon" target="_blank">
                    <img src="https://cdn.simpleicons.org/facebook/6e5494" alt="Facebook" width="40">
                </a>
                <a href="#" class="social-icon" target="_blank">
                    <img src="https://cdn.simpleicons.org/tiktok/000000" alt="TikTok" width="40">
                </a>
                <a href="#" class="social-icon" target="_blank">
                    <img src="https://skillicons.dev/icons?i=instagram" alt="Instagram" width="40">
                </a>
                <a href="#" class="social-icon" target="_blank">
                    <img src="https://skillicons.dev/icons?i=twitter" alt="X" width="40">
                </a>
            </div>

            <div class="d-flex gap-4 ps-2 pb-5">
                <p class="mb-1"><strong>Sales team</strong><br>ventas@uTime.com</p>
                <p><strong>Support team</strong><br>soporte@uTime.com</p>
            </div>

            <h4 class="text-start py-2 px-2">PaxTech</h4>

            <div class="d-flex gap-4 ps-2 pb-3">
                <a href="#" class="social-icon" target="_blank">
                    <img src="https://cdn.simpleicons.org/facebook/6e5494" alt="Facebook" width="40">
                </a>
                <a href="#" class="social-icon" target="_blank">
                    <img src="https://cdn.simpleicons.org/tiktok/000000" alt="TikTok" width="40">
                </a>
                <a href="#" class="social-icon" target="_blank">
                    <img src="https://skillicons.dev/icons?i=instagram" alt="Instagram" width="40">
                </a>
                <a href="#" class="social-icon" target="_blank">
                    <img src="https://skillicons.dev/icons?i=twitter" alt="X" width="40">
                </a>
            </div>
        </div>

        <!-- Contact Form -->
        <div class="col-md-6 px-4 shadow-lg">
            <div class="cardColor p-5 pb-1 text-white">
                <div class="contact-form card-body">
                    <h2 class="text-center mb-4 text-black">GET IN TOUCH</h2>
                    <form>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <input type="text" class="form-control" placeholder="First Name">
                            </div>
                            <div class="col-md-6">
                                <input type="text" class="form-control" placeholder="Last Name">
                            </div>
                        </div>
                        <div class="mb-3">
                            <input type="email" class="form-control" placeholder="E-mail">
                        </div>
                        <div class="mb-4">
                            <textarea class="form-control" rows="6" placeholder="Comment"></textarea>
                        </div>
                        <div class="text-center">
                            <button type="submit" class="btn btn-primary btn-lg px-4 py-2 rounded-pill fw-bold">Contact me</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const translations = {
        en: {
            "navbar.home": "Home",
            "navbar.pricing": "Pricing",
            "navbar.about": "About Us",
            "navbar.contact": "Contact us",
            "navbar.more": "More",
            "contact.title": "CONTACT US"
        },
        es: {
            "navbar.home": "Inicio",
            "navbar.pricing": "Precios",
            "navbar.about": "Sobre nosotros",
            "navbar.contact": "Contáctanos",
            "navbar.more": "Más",
            "contact.title": "CONTÁCTANOS"
        }
    };

    let currentLang = 'en';

    document.querySelector('[data-toggle-lang]').addEventListener('click', () => {
        currentLang = currentLang === 'en' ? 'es' : 'en';
        const elements = document.querySelectorAll('[data-i18n]');

        elements.forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (translations[currentLang][key]) {
                el.innerHTML = translations[currentLang][key];
            }
        });

        document.querySelector('[data-toggle-lang]').innerText = currentLang.toUpperCase();

        document.getElementById("sign-in-btn").innerText = currentLang === 'en' ? 'Sign in' : 'Iniciar sesión';
        document.getElementById("register-btn").innerText = currentLang === 'en' ? 'Register' : 'Registrarse';
    });
</script>
</body>
</html>
