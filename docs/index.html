<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>uTime</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="https://avatars.githubusercontent.com/u/205873631?s=400&u=7181957c1d03747f9dd9a668e2d4857d99ce55ff&v=4" type="image/png">
</head>

<body class="font-sans text-gray-900 bg-white leading-relaxed bg-gradient-to-b from-purple-100 via-pink-50 to-white ">


<!-- Botón flotante redondo, oculto al inicio -->
<button id="restoreNavbarBtn"
        class="fixed top-4 left-4 z-50 bg-purple-700 text-white p-3 w-12 h-12 flex items-center justify-center rounded-full shadow-lg hover:bg-purple-800 transition-all duration-500 transform -translate-y-10 opacity-0 pointer-events-none"
        aria-label="Mostrar navbar">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"
         xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path>
    </svg>
</button>

<!-- Navbar principal -->
<header id="navbarWrapper"
        class="fixed top-0 left-0 w-full z-40 flex justify-center px-5 transform transition-all duration-500 ease-in-out translate-y-0 opacity-100">
    <nav
            class="flex items-center justify-between w-full max-w-screen-xl backdrop-blur-md bg-white/90 border border-gray-200 shadow-lg px-10 py-4 mt-5 rounded-full ring-1 ring-gray-100">

        <!-- Botón para colapsar -->
        <button id="collapseNavbarBtn"
                class="mr-6 text-purple-700 hover:text-white bg-purple-100 hover:bg-purple-700 transition-all duration-300 rounded-full p-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
            </svg>
        </button>
        <!-- Logo -->
        <div class="flex items-center">
            <button onclick="window.scrollTo({ top: 0, behavior: 'smooth' })">
                <img src="https://github.com/UPC-PaxTech/uTime/blob/main/img/logoutime.png?raw=true" alt="Logo" class="h-10 w-auto max-h-full">
            </button>
        </div>

        <!-- Links -->
        <ul class="hidden md:flex gap-6 flex-1 justify-center text-base font-medium text-gray-600">
            <li><a href="#features" class="hover:text-purple-700 transition-colors duration-200 relative group" data-i18n="navbar_features">
                Features <span
                    class="absolute left-0 -bottom-1 w-0 h-0.5 bg-purple-700 transition-all group-hover:w-full"></span>
            </a></li>
            <li><a href="#howitworks" class="hover:text-purple-700 transition-colors duration-200 relative group" data-i18n="navbar_howitworks">
                How it Works <span
                    class="absolute left-0 -bottom-1 w-0 h-0.5 bg-purple-700 transition-all group-hover:w-full"></span>
            </a></li>
            <li><a href="#pricing" class="hover:text-purple-700 transition-colors duration-200 relative group" data-i18n="navbar_pricing">
                Pricing <span
                    class="absolute left-0 -bottom-1 w-0 h-0.5 bg-purple-700 transition-all group-hover:w-full"></span>
            </a></li>
            <li><a href="#testimonials" class="hover:text-purple-700 transition-colors duration-200 relative group" data-i18n="navbar_testimonials">
                Testimonials <span
                    class="absolute left-0 -bottom-1 w-0 h-0.5 bg-purple-700 transition-all group-hover:w-full"></span>
            </a></li>
            <li><a href="#faq" class="hover:text-purple-700 transition-colors duration-200 relative group">
                FAQ <span
                    class="absolute left-0 -bottom-1 w-0 h-0.5 bg-purple-700 transition-all group-hover:w-full"></span>
            </a></li>
        </ul>

        <div class="relative mr-4">
            <button id="languageToggle" class="flex items-center gap-2 px-3 py-2 text-gray-600 hover:text-purple-700 transition-colors duration-200 bg-white border border-gray-200 rounded-lg shadow-sm hover:shadow-md">
                <img id="currentFlag" src="https://upload.wikimedia.org/wikipedia/en/a/a4/Flag_of_the_United_States.svg" width="20" height="14" class="rounded-sm" />
                <span id="currentLangText" class="text-sm font-medium">English</span>
                <svg class="w-4 h-4 transition-transform duration-200" id="languageArrow" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                </svg>
            </button>

            <div id="languageMenu" class="absolute top-full right-0 mt-2 bg-white border border-gray-200 rounded-lg shadow-lg overflow-hidden opacity-0 invisible transform scale-95 transition-all duration-200 z-50">
                <button class="language-option w-full flex items-center gap-3 px-4 py-3 text-left hover:bg-purple-50 transition-colors duration-200" data-lang="en">
                    <img src="https://upload.wikimedia.org/wikipedia/en/a/a4/Flag_of_the_United_States.svg" width="20" height="14" class="rounded-sm" />
                    <span class="text-sm font-medium text-gray-700" data-i18n="lang_english">English</span>
                </button>
                <button class="language-option w-full flex items-center gap-3 px-4 py-3 text-left hover:bg-purple-50 transition-colors duration-200" data-lang="es">
                    <img src="https://upload.wikimedia.org/wikipedia/en/9/9a/Flag_of_Spain.svg" width="20" height="14" class="rounded-sm" />
                    <span class="text-sm font-medium text-gray-700" data-i18n="lang_spanish">Spanish</span>
                </button>
            </div>
        </div>
        <script>
            // Traducciones directas - SIN cargar desde archivo
            let translations = {
            };

            let isMenuOpen = false;

            const languages = {
                en: {
                    name: "English",
                    flag: "https://upload.wikimedia.org/wikipedia/en/a/a4/Flag_of_the_United_States.svg"
                },
                es: {
                    name: "Español",
                    flag: "https://upload.wikimedia.org/wikipedia/en/9/9a/Flag_of_Spain.svg"
                }
            };

            // Esperar a que el DOM esté listo
            document.addEventListener('DOMContentLoaded', () => {
                const languageToggle = document.getElementById('languageToggle');
                const languageMenu = document.getElementById('languageMenu');
                const languageArrow = document.getElementById('languageArrow');
                const currentFlag = document.getElementById('currentFlag');
                const currentLangText = document.getElementById('currentLangText');
                const languageOptions = document.querySelectorAll('.language-option');

                // Mostrar/ocultar menú
                function toggleMenu() {
                    isMenuOpen = !isMenuOpen;
                    if (isMenuOpen) {
                        languageMenu.classList.remove('opacity-0', 'invisible', 'scale-95');
                        languageMenu.classList.add('opacity-100', 'visible', 'scale-100');
                        languageArrow.style.transform = 'rotate(180deg)';
                    } else {
                        languageMenu.classList.add('opacity-0', 'invisible', 'scale-95');
                        languageMenu.classList.remove('opacity-100', 'visible', 'scale-100');
                        languageArrow.style.transform = 'rotate(0deg)';
                    }
                }

                function loadTranslations(lang) {
                    fetch('assets/translation/translations.json')
                        .then(response => response.json())
                        .then(data => {
                            translations = data;
                            switchLanguage(lang);
                        })
                        .catch(error => console.error('Error loading translations:', error));
                }

                function switchLanguage(lang) {
                    // Cambiar textos traducibles
                    document.querySelectorAll("[data-i18n]").forEach(el => {
                        const key = el.getAttribute("data-i18n");
                        if (translations[lang] && translations[lang][key]) {
                            el.innerHTML = translations[lang][key];
                        }
                    });

                    // Cambiar bandera y nombre en el botón principal
                    currentFlag.src = languages[lang].flag;
                    currentLangText.textContent = languages[lang].name;
                }


                // Event listeners
                languageToggle.addEventListener('click', (e) => {
                    e.stopPropagation();
                    console.log('Toggle clicked');
                    toggleMenu();
                });

                languageOptions.forEach(option => {
                    option.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const langCode = option.getAttribute('data-lang');
                        console.log('Language option clicked:', langCode);
                        loadTranslations(langCode);
                        toggleMenu();
                    });
                });

                document.addEventListener('click', () => {
                    if (isMenuOpen) {
                        toggleMenu();
                    }
                });

                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape' && isMenuOpen) {
                        toggleMenu();
                    }
                });

                // Inicializar con inglés
                loadTranslations('en')
            });
        </script>

        <!-- CTA -->
        <a href="https://upc-paxtech.github.io/Frontend-Web-Applications/"
           class="ml-4 bg-purple-700 text-white font-semibold px-5 py-2.5 rounded-md shadow-md hover:bg-purple-800 transition duration-300" data-i18n="get_started">
            Get Started
        </a>
    </nav>
</header>

<script>
    const collapseBtn = document.getElementById('collapseNavbarBtn');
    const restoreBtn = document.getElementById('restoreNavbarBtn');
    const navbar = document.getElementById('navbarWrapper');

    collapseBtn.addEventListener('click', () => {
        // Oculta el navbar desplazándolo hacia arriba
        navbar.classList.add('-translate-y-full', 'opacity-0', 'pointer-events-none');

        // Muestra el botón flotante bajando
        restoreBtn.classList.remove('opacity-0', 'pointer-events-none', '-translate-y-10');
        restoreBtn.classList.add('translate-y-0');
    });

    restoreBtn.addEventListener('click', () => {
        // Restaura el navbar bajando desde arriba
        navbar.classList.remove('-translate-y-full', 'opacity-0', 'pointer-events-none');

        // Oculta el botón flotante subiéndolo
        restoreBtn.classList.add('opacity-0', 'pointer-events-none', '-translate-y-10');
        restoreBtn.classList.remove('translate-y-0');
    });
</script>
